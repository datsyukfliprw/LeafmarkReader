name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leafmark
          POSTGRES_PASSWORD: leafmark
          POSTGRES_DB: leafmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leafmark -d leafmark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://leafmark:leafmark@127.0.0.1:5432/leafmark_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
